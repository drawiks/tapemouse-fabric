plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def modVersion = project.version

	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def baseName = project.archives_base_name

	from("LICENSE") {
		rename { "${it}_${baseName}" }
	}

	exclude 'io/github/drawiks/tapemouse/TapeMouseSelfCheck.class'
}

tasks.register('selfCheck', JavaExec) {
	group = 'verification'
	description = 'Runs the delay counter self-check.'
	enableAssertions = true
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'io.github.drawiks.tapemouse.TapeMouseSelfCheck'
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}