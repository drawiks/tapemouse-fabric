name: Build and Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # read version from gradle.properties (source of truth)
      - name: Resolve version
        id: v
        run: |
          version=$(git show HEAD:gradle.properties | sed -n 's/^mod_version=//p' | tr -d '[:space:]')
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # decide: release only if push to main AND mod_version changed AND tag doesn't exist
      - name: Decide release
        id: release
        run: |
          version="${{ steps.v.outputs.value }}"
          tag="v$version"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "reason=pull request" >> "$GITHUB_OUTPUT"
            echo "build_version=$version-SNAPSHOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            echo "build_version=$version-SNAPSHOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # push to main: compare mod_version in HEAD vs HEAD~1
          previous=$(git show HEAD~1:gradle.properties 2>/dev/null | sed -n 's/^mod_version=//p' | tr -d '[:space:]' || true)
          current=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')

          if [[ -z "$previous" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "reason=first commit, no previous version" >> "$GITHUB_OUTPUT"
            echo "build_version=$current-SNAPSHOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$previous" == "$current" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "reason=mod_version unchanged ($current)" >> "$GITHUB_OUTPUT"
            echo "build_version=$current-SNAPSHOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$current"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "reason=tag $tag already exists on remote" >> "$GITHUB_OUTPUT"
            echo "build_version=$current-SNAPSHOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "reason=mod_version $previous -> $current" >> "$GITHUB_OUTPUT"
          echo "build_version=$current" >> "$GITHUB_OUTPUT"

      - name: Self-check
        run: ./gradlew selfCheck -Pmod_version=${{ steps.release.outputs.build_version }}

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.release.outputs.build_version }}

      # explicit path: *-sources.jar also matches looser globs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tapemouse-fabric-${{ steps.release.outputs.build_version }}
          path: build/libs/tapemouse-fabric-${{ steps.release.outputs.build_version }}.jar
          if-no-files-found: error

      # create tag + release only when Decide release said so
      - name: Create release
        if: ${{ steps.release.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.v.outputs.value }}"
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --generate-notes \
            "build/libs/tapemouse-fabric-$version.jar"